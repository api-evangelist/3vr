name: 3VR
description: >-
  3VR, Inc. was a San Francisco-based video intelligence and video
  surveillance analytics company founded in 2005 and backed by Kleiner Perkins
  among others. Its VisionPoint VMS and Video Intelligence Platform combined
  video management with search-driven analytics including facial recognition,
  license plate recognition, object tracking, dwell/loitering detection,
  people counting, queue management, and forensic video search across IP,
  analog, and megapixel cameras, with an open architecture for third-party
  integration into POS, access control, and alarm systems. 3VR was acquired
  by Identiv in 2018 (approximately $6.9M) and folded into Identiv's Hirsch
  physical access control platform; Identiv's physical security business,
  including the 3VR line, was subsequently divested to Vitaprotech in 2024.
  The 3vr.com domain now redirects to Hirsch/Identiv support and no public
  developer API is documented.
